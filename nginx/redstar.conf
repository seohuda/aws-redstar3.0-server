# Nginx Reverse Proxy for Red Star OS 3.0 Server Web Gateway
# Listens on port 80 and forwards requests to the Red Star OS guest VM.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100M;

    location / {
        # Default libvirt NAT network guest IP or hostname
        proxy_pass http://192.168.122.100:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        # Fallback to local status page if guest web service is offline
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Red Star OS 3.0 Server - EC2 Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b1528; color: #fff; text-align: center; padding: 60px 20px; }
        .card { background: #16243d; border-radius: 12px; padding: 40px; max-width: 620px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2a3c5a; }
        h1 { color: #e74c3c; margin-bottom: 8px; font-size: 26px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        p { font-size: 15px; line-height: 1.7; color: #cbd5e1; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; background: #2563eb; color: #fff; font-weight: 600; font-size: 13px; margin-bottom: 15px; }
        .info-box { background: #0f1c30; border-radius: 6px; padding: 15px; text-align: left; margin-top: 25px; font-family: monospace; font-size: 13px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>붉은별 3.0 서버 (Red Star OS 3.0 Server)</h1>
        <div class="subtitle">KVM-Accelerated Cloud Instance on AWS EC2</div>
        <span class="badge">호스트 게이트웨이 정상 가동 중</span>
        <p>
            Red Star OS 가상 머신이 현재 설치 중이거나 부팅 준비 상태입니다.<br>
            VNC 콘솔(포트 5900)을 통해 OS 설치를 완료하고 Apache 웹서버를 시작하면 본 페이지가 Red Star OS 웹사이트로 자동 전환됩니다.
        </p>
        <div class="info-box">
            # VNC 콘솔 접속 터널링 명령:<br>
            ssh -i infra/redstar-key.pem -N -L 5900:127.0.0.1:5900 ubuntu@&lt;EC2_PUBLIC_IP&gt;
        </div>
    </div>
</body>
</html>';
    }
}
