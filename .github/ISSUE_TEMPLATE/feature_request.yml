name: Feature request
description: Suggest an improvement to the project
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation does this proposal address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or implementation you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternatives or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, diagrams, or references if useful. Do not upload installation media or secrets.
