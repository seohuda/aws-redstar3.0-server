name: Bug report
description: Report a reproducible problem in the infrastructure or tooling
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, private keys, IPs you do not want public, and copyrighted installation media before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence of commands or actions.
      placeholder: |
        1. terraform -chdir=infra apply ...
        2. ./scripts/...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include host OS, Terraform version, AWS region/instance type, and relevant tool versions.
      placeholder: |
        Host OS:
        Terraform:
        AWS region:
        EC2 instance type:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs that do not contain secrets or sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private keys, tokens, and other secrets.
          required: true
        - label: I did not attach Red Star OS ISO images or VM disk images.
          required: true
